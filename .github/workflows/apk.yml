name: Build APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DharmIS-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: DharmIS-apk, path: 'DharmIS-*.apk' }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" DharmIS-*.apk --target "${{ github.sha }}" --title "DharmIS build ${{ github.run_number }}" --notes "Debug-signed APK for sideloading. Branch ${{ github.ref_name }}." --prerelease
